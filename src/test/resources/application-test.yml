spring:
    datasource:
        url: jdbc:h2:mem:mr-world-test;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: false

app:
    security:
        jwt:
            secret-key: test-only-secret-key-with-at-least-32-bytes
            cookie-secure: false
